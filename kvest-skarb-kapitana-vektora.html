<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квест «Скарб капітана Вектора»</title>
<style>
:root{--ink:#3b2a14;--paper:#f6ecd2;--paper2:#efe0b8;--sea:#1f6f8b;--ok:#2e8b57;--bad:#c0392b;--gold:#e0a21b;--pw:clamp(150px,calc(50vw - 360px - 46px),300px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:linear-gradient(#bfe3ee,#8ec5d8 40%,#5ea3bd) fixed;min-height:100vh;overflow-x:hidden}
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:16px 14px 150px}
h1{margin:6px 0 14px;font-size:28px;text-align:center;color:#0f3d52;text-shadow:0 2px 0 rgba(255,255,255,.5)}
h1 .anc{display:inline-block;animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
.card{background:var(--paper);border:3px solid #a8845a;border-radius:16px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
/* карта маршруту */
.bar{position:relative;padding-top:28px;margin:0 0 12px}
.dots{display:flex;gap:14px;justify-content:center;position:relative}
.dots::before{content:"";position:absolute;left:20px;right:20px;top:50%;border-top:3px dashed #a8845a;transform:translateY(-50%)}
.dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--paper2);border:2px solid #a8845a;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;transition:background .4s}
.dot.cur{background:var(--gold);border-color:#8a5a00;animation:ring 1.8s infinite}
.dot.done{background:var(--ok);color:#fff;border-color:#1d6b40}
.shipmark{position:absolute;top:0;left:0;transition:left 1s ease-in-out;transform:translateX(-50%);font-size:24px;line-height:1;z-index:3}
.shipmark span{display:block;animation:bobm 2.2s ease-in-out infinite}
.slots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.slot{width:42px;height:50px;border:2px dashed #a8845a;border-radius:8px;background:#fff8e6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#7a4a00;position:relative}
.slot small{position:absolute;top:1px;left:4px;font-size:10px;color:#a8845a;font-weight:normal}
.ansrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.ansrow .slot{font:inherit;font-size:26px;font-weight:bold;cursor:pointer;width:46px;height:54px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tileb{font:inherit;font-size:26px;font-weight:bold;width:52px;height:58px;border-radius:10px;border:2px solid #7a4a00;background:var(--gold);color:#3b2a14;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
.tileb:hover:not(:disabled){transform:translateY(-3px)}
.tileb:disabled{opacity:.25;cursor:default;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.slot.on{border-style:solid;background:#fff2b8}
.slot.pop{animation:pop .8s cubic-bezier(.3,1.8,.5,1)}
h2{margin:0 0 8px;font-size:21px}
.scene{display:block;width:100%;height:auto;aspect-ratio:700/170;border-radius:12px;border:3px solid #a8845a;margin:0 0 12px;background:#9ad}
.story{margin:0 0 10px;padding:10px 12px;background:#fbf3dc;border-left:5px solid #a8845a;border-radius:8px;font-style:italic;line-height:1.55}
.story b{font-style:normal;color:#7a4a00}
.parrot{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.parrot .av{font-size:30px;line-height:1;animation:hop 2.6s ease-in-out infinite}
.parrot .bub{background:#e6f3f7;border:2px solid #9cc7d6;border-radius:14px 14px 14px 2px;padding:7px 12px;line-height:1.5;position:relative}
.expl{display:none;background:#fff4e0;border-left:5px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0;line-height:1.7}
.again{display:inline-block;background:#e6f3f7;border:2px solid #9cc7d6;border-radius:20px;padding:3px 12px;font-weight:bold;margin:4px 0}
.task{font-size:18px;margin:10px 0;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{font:inherit;font-size:20px;padding:12px 8px;border:2px solid #a8845a;border-radius:12px;background:#fffdf5;cursor:pointer;color:var(--ink);transition:transform .15s,background .2s}
.opt:hover:not(:disabled){background:#fff0c4;transform:translateY(-2px)}
.opt.right{background:var(--ok);color:#fff;border-color:#1d6b40;animation:pop .6s}
.opt.wrong{background:#f6c9c3;border-color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.btn{font:inherit;font-size:17px;padding:10px 18px;border-radius:12px;border:2px solid #7a4a00;background:var(--gold);color:#3b2a14;cursor:pointer;font-weight:bold;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border-color:#a8845a;font-weight:normal}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hint{background:#e6f3f7;border-left:5px solid var(--sea);padding:10px 12px;border-radius:8px;margin:10px 0;display:none;line-height:1.6}
.msg{min-height:24px;font-weight:bold;margin:6px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.reward{display:none;text-align:center;background:#fff2b8;border:2px solid var(--gold);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.55}
.reward .after{font-style:italic;margin-bottom:8px}
.reward b{font-size:36px;color:#7a4a00}
.letter{display:inline-block;animation:pop .9s cubic-bezier(.3,1.8,.5,1)}
.plot{text-align:center;margin:8px 0}
.shake{animation:sh .35s}
input.word.nm{text-transform:none;letter-spacing:1px}
.namebox{text-align:center;margin:8px 0}
input.word{font:inherit;font-size:24px;text-transform:uppercase;letter-spacing:4px;text-align:center;width:100%;max-width:300px;padding:10px;border:2px solid #a8845a;border-radius:12px}
mjx-container{font-size:112%}
.opt mjx-container{font-size:120%}
.final,.win{text-align:center}
.win h2{font-size:26px}
.enter{animation:enter .55s ease both}
.letterbox{background:#fbf3dc;border:2px dashed #a8845a;border-radius:10px;padding:12px 14px;margin:0 0 10px;font-style:italic;line-height:1.6;position:relative}
.badge{display:inline-block;margin:6px 0;padding:6px 14px;border-radius:20px;background:var(--gold);border:2px solid #7a4a00;font-weight:bold}
/* бічні «ілюмінатори» */
.side{position:fixed;top:84px;bottom:28px;width:var(--pw);border:6px solid #a8845a;border-radius:20px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15),inset 0 0 30px rgba(0,0,0,.35);z-index:1;display:none;background:#0b3d5c}
.side.l{left:calc(50% - 360px - var(--pw) - 22px)}
.side.r{left:calc(50% + 360px + 22px)}
.side svg{width:100%;height:100%;display:block}
@media(min-width:1100px){.side{display:block}}
/* фон */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgw{position:absolute;left:0;right:0;bottom:0;height:130px;overflow:hidden}
.bgw svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:bgmove 18s linear infinite}
.bgw svg.b2{animation-duration:26s;animation-direction:reverse;bottom:-12px;opacity:.9}
.bgship{position:absolute;bottom:62px;left:0;width:90px;height:80px;animation:sail 75s linear infinite}
.bgcloud{position:absolute;width:140px;height:58px;opacity:.85;animation:cdrift 90s linear infinite}
.fx{position:fixed;z-index:50;pointer-events:none;font-size:22px;animation:fxup 1.5s ease-out both}
/* анімації */
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,162,27,.7)}100%{box-shadow:0 0 0 12px rgba(224,162,27,0)}}
@keyframes bobm{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(3px) rotate(6deg)}}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) rotate(-8deg)}60%{transform:translateY(0)}}
@keyframes fxup{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes bgmove{to{transform:translateX(-50%)}}
@keyframes sail{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 120px))}}
@keyframes cdrift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
/* анімації всередині SVG */
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(5px) rotate(2.5deg)}}
.wv{animation:wvmove 8s linear infinite}
@keyframes wvmove{to{transform:translateX(-700px)}}
.drift{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(840px)}}
.fly{animation:fly 14s linear infinite}
@keyframes fly{0%{transform:translate(-80px,0)}50%{transform:translate(340px,-12px)}100%{transform:translate(780px,0)}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.slide{animation:slide 7s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.cur{animation:curr 5s linear infinite}
@keyframes curr{0%{transform:translateX(130px);opacity:0}15%{opacity:.85}85%{opacity:.85}100%{transform:translateX(520px);opacity:0}}
.fog{animation:fogm 18s ease-in-out infinite alternate}
@keyframes fogm{from{transform:translateX(-50px)}to{transform:translateX(60px)}}
.toss{transform-box:fill-box;transform-origin:50% 90%;animation:toss 2.2s ease-in-out infinite}
@keyframes toss{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-6px) rotate(9deg)}}
.rain{animation:rain 1s linear infinite}
@keyframes rain{from{transform:translate(0,-12px)}to{transform:translate(-34px,190px)}}
.flash{animation:flash 5s infinite;opacity:0}
@keyframes flash{0%,86%,100%{opacity:0}88%{opacity:1}90%{opacity:.15}92%{opacity:1}95%{opacity:0}}
.beam{animation:beam 6s ease-in-out infinite;transform-origin:606px 64px}
@keyframes beam{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
.swL{animation:swL 20s linear infinite}
@keyframes swL{from{transform:translateX(300px)}to{transform:translateX(-90px)}}
.swR{animation:swR 20s linear infinite}
@keyframes swR{from{transform:translateX(-90px)}to{transform:translateX(300px)}}
.air{animation:bubu 9s linear infinite;fill:rgba(255,255,255,.22);stroke:#fff;stroke-width:1}
@keyframes bubu{0%{transform:translateY(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-590px);opacity:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ray{animation:ray 7s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.04}50%{opacity:.15}}
.flt{animation:flt 6s ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(0)}to{transform:translateY(-30px)}}
.pls{transform-box:fill-box;transform-origin:50% 0;animation:pls 1.8s ease-in-out infinite alternate}
@keyframes pls{from{transform:scale(1.06,.9)}to{transform:scale(.94,1.1)}}
.crabw{animation:crabw 8s ease-in-out infinite alternate}
@keyframes crabw{from{transform:translateX(20px)}to{transform:translateX(170px)}}
/* скриня */
.cs .lid{transform-box:fill-box;transform-origin:0 100%;transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
.cs.open .lid{transform:translateY(-14px) rotate(-22deg)}
.cs .gl{opacity:0;transition:opacity 1.2s .3s}
.cs.open .gl{opacity:1}
.cs .coin{opacity:0}
.cs.open .coin{animation:coin 1.8s ease-out forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}65%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(var(--dx),calc(var(--dy) + 40px));opacity:1}}
.cs:not(.open) .chestg{animation:rattle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rattle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@media(max-width:420px){.dot{width:28px;height:28px;font-size:12px}.dots{gap:8px}.slot{width:38px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
// ---------- допоміжні функції для запису математики (LaTeX / MathJax) ----------
const VT = s => s.length > 1 ? '\\overrightarrow{' + s + '}' : '\\vec{' + s + '}';
const V  = s => '\\(' + VT(s) + '\\)';
const SQ = n => '\\(\\sqrt{' + n + '}\\)';
const C  = (x, y) => ('\\((' + x + ';\\,' + y + ')\\)').replace(/−/g, '-');
const N  = n => '\\(' + n + '\\)';
const M  = s => s.replace(/-/g, '−');
function typeset(){ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([document.getElementById('stage')]).catch(()=>{}); }

// ---------- координатна площина («морська карта») ----------
function plot(o){
  const s = 26, m = 18;
  const W = (o.x[1]-o.x[0])*s + 2*m, H = (o.y[1]-o.y[0])*s + 2*m;
  const X = x => m + (x-o.x[0])*s, Y = y => m + (o.y[1]-y)*s;
  let g = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;background:#fffdf5;border:2px solid #a8845a;border-radius:10px">';
  g += '<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f6f8b"/></marker>'
     + '<marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker></defs>';
  for(let i=o.x[0]; i<=o.x[1]; i++) g += '<line x1="'+X(i)+'" y1="'+Y(o.y[0])+'" x2="'+X(i)+'" y2="'+Y(o.y[1])+'" stroke="#e5d6b0" stroke-width="1"/>';
  for(let j=o.y[0]; j<=o.y[1]; j++) g += '<line x1="'+X(o.x[0])+'" y1="'+Y(j)+'" x2="'+X(o.x[1])+'" y2="'+Y(j)+'" stroke="#e5d6b0" stroke-width="1"/>';
  if(o.x[0] <= 0 && o.x[1] >= 0) g += '<line x1="'+X(0)+'" y1="'+Y(o.y[0])+'" x2="'+X(0)+'" y2="'+Y(o.y[1])+'" stroke="#8a6d3b" stroke-width="2"/>';
  if(o.y[0] <= 0 && o.y[1] >= 0) g += '<line x1="'+X(o.x[0])+'" y1="'+Y(0)+'" x2="'+X(o.x[1])+'" y2="'+Y(0)+'" stroke="#8a6d3b" stroke-width="2"/>';
  for(let i=o.x[0]; i<=o.x[1]; i++) if(i!==0 && i%1===0) g += '<text x="'+X(i)+'" y="'+(Y(0)>H-4?H-4:Math.min(Y(0)+12,H-3))+'" font-size="9" text-anchor="middle" fill="#8a6d3b">'+M(String(i))+'</text>';
  for(let j=o.y[0]; j<=o.y[1]; j++) if(j!==0) g += '<text x="'+Math.max(X(0)-4,8)+'" y="'+(Y(j)+3)+'" font-size="9" text-anchor="end" fill="#8a6d3b">'+M(String(j))+'</text>';
  (o.vecs||[]).forEach(v=>{
    const col = v.c==='r' ? '#c0392b' : '#1f6f8b';
    g += '<line x1="'+X(v.x1)+'" y1="'+Y(v.y1)+'" x2="'+X(v.x2)+'" y2="'+Y(v.y2)+'" stroke="'+col+'" stroke-width="3" marker-end="url(#'+(v.c==='r'?'ar2':'ar')+')"/>';
    if(v.label){
      const lx = (X(v.x1)+X(v.x2))/2 + (v.dx||0), ly = (Y(v.y1)+Y(v.y2))/2 + (v.dy||0);
      g += '<text x="'+lx+'" y="'+ly+'" font-size="15" font-weight="bold" font-style="italic" fill="'+col+'">'+v.label+'</text>';
    }
  });
  (o.pts||[]).forEach(p=>{
    g += '<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4.5" fill="#3b2a14"/>';
    g += '<text x="'+(X(p.x)+(p.dx===undefined?7:p.dx))+'" y="'+(Y(p.y)+(p.dy===undefined?-7:p.dy))+'" font-size="15" font-weight="bold" fill="#3b2a14">'+p.n+'</text>';
  });
  if(o.route){ // кораблик пливе по маршруту
    const d = 'M' + o.route.map(p=>X(p[0])+' '+Y(p[1])).join(' L');
    const dur = 2.5 * (o.route.length-1);
    g += '<g><use href="#ship" x="-11" y="-18" width="22" height="20"/><animateMotion dur="'+dur+'s" repeatCount="indefinite" path="'+d+'"/></g>';
  }
  return g + '</svg>';
}

// ---------- малювання морських сцен ----------
const R = (a,b)=>a+Math.random()*(b-a);
const wp = (y,amp,per)=>{ let d='M0 '+y; for(let x=0;x<1400;x+=per) d+=' q'+per/4+' '+(-amp)+' '+per/2+' 0 t'+per/2+' 0'; return d+' V170 H0Z'; };
const wv = (y,amp,per,fill,op,dur,dl,rev)=>'<path class="wv" d="'+wp(y,amp,per)+'" fill="'+fill+'" opacity="'+op+'" style="animation-duration:'+dur+'s;animation-delay:'+dl+'s'+(rev?';animation-direction:reverse':'')+'"/>';
const sea  = (y,a='#3aa3c4',b='#2a87a9',c='#1d6f8e')=>'<rect y="'+y+'" width="700" height="'+(170-y)+'" fill="'+c+'"/>'+wv(y,5,100,b,.9,9,0)+wv(y+10,4,70,a,.55,7,-3,1);
const seaF = (y,col='#1a6483')=>wv(y,5,140,col,.92,6,-2);
const svg  = (sky,inner,cls='')=>'<svg class="scene '+cls+'" viewBox="0 0 700 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="700" height="170" fill="url(#'+sky+')"/>'+inner+'</svg>';
const cloud = (x,y,s,dur,fill)=>'<g class="drift" style="animation-duration:'+dur+'s;animation-delay:-'+(R(0,dur)).toFixed(1)+'s"><use href="#cloud" x="'+x+'" y="'+y+'" width="'+140*s+'" height="'+58*s+'"'+(fill?' style="color:'+fill+'"':'')+'/></g>';
const gull = (y,dur,dl)=>'<g class="fly" style="animation-duration:'+dur+'s;animation-delay:'+dl+'s"><use class="flap" href="#gull" x="0" y="'+y+'" width="26" height="12"/></g>';
const sun = (x,y,r=20)=>{ let l=''; for(let k=0;k<12;k++){const a=k*Math.PI/6; l+='<line x1="'+(r+6)*Math.cos(a)+'" y1="'+(r+6)*Math.sin(a)+'" x2="'+(r+14)*Math.cos(a)+'" y2="'+(r+14)*Math.sin(a)+'"/>';}
  return '<g transform="translate('+x+','+y+')"><g class="spin" stroke="#ffd95a" stroke-width="3" stroke-linecap="round">'+l+'</g><circle r="'+r+'" fill="#ffd95a"/><circle r="'+(r-6)+'" fill="#ffe98f"/></g>'; };
const star = (x,y,s=1,dl=0)=>'<g transform="translate('+x+','+y+') scale('+s+')"><path class="tw" style="animation-delay:'+dl+'s" d="M0 -6L1.6 -1.6L6 0L1.6 1.6L0 6L-1.6 1.6L-6 0L-1.6 -1.6Z" fill="#fff4b0"/></g>';

function fishG(y,w,c,dir,dur,dl){ const u='<use href="#fish" width="'+w+'" height="'+(w*.6)+'" style="color:'+c+'"/>';

  for(let i=0;i<4;i++){ const x=R(-20,200); s+='<polygon class="ray" points="'+x+',0 '+(x+28)+',0 '+(x+90)+',560 '+(x+40)+',560" fill="#fff" style="animation-delay:-'+R(0,7).toFixed(1)+'s"/>'; }

    ['#f39c12','#ff7f50','#ffd166','#6ee7b7','#ff8fab','#f9c74f'].forEach((c,i)=>{ s+=fishG(R(70,430),R(26,40),c,i%2?1:-1,R(14,26),R(0,20)); });
  } else {
    s+='<g class="swR" style="animation-duration:48s;animation-delay:-14s"><g transform="translate(0,230)"><use href="#whale" width="130" height="61" style="opacity:.55"/></g></g>';

  for(let i=0;i<12;i++) s+='<circle class="air" cx="'+R(10,230).toFixed(0)+'" cy="560" r="'+R(2,6).toFixed(1)+'" style="animation-duration:'+R(7,13).toFixed(1)+'s;animation-delay:-'+R(0,12).toFixed(1)+'s"/>';
  const weeds = kind==='l' ? ['#2e8b57','#3fae6a','#2e8b57','#58c47e','#2e8b57','#3fae6a'] : ['#2e8b8b','#6c5bb5','#2e8b8b','#6c5bb5'];
  weeds.forEach((c,i)=>{ const x=20+i*(200/(weeds.length-1)); s+='<path class="sway" d="M'+x+' 548q-12 -26 0 -52q12 -26 0 -52q-10 -22 2 -44" fill="none" stroke="'+c+'" stroke-width="'+R(5,8).toFixed(1)+'" stroke-linecap="round" style="animation-delay:-'+R(0,3).toFixed(1)+'s"/>'; });

    s+='<path transform="translate(200,545)" d="M0 -9L2.4 -3L9 -2.8L4 1.6L5.6 8L0 4.4L-5.6 8L-4 1.6L-9 -2.8L-2.4 -3Z" fill="#f2994a"/><path transform="translate(36,548) scale(.8)" d="M0 -9L2.4 -3L9 -2.8L4 1.6L5.6 8L0 4.4L-5.6 8L-4 1.6L-9 -2.8L-2.4 -3Z" fill="#e76f51"/>';

  }
  return s+'</svg>';

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function burst(el,list,n=14){
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<n;i++){ const e=document.createElement('span'); e.className='fx'; e.textContent=list[i%list.length];
    e.style.left=cx+'px'; e.style.top=cy+'px'; e.style.setProperty('--dx',(Math.random()*260-130)+'px'); e.style.setProperty('--dy',(-(50+Math.random()*150))+'px');
    e.style.animationDelay=(Math.random()*.2)+'s'; document.body.appendChild(e); setTimeout(()=>e.remove(),1900); }
}
function moveShip(){ const idx = cur<0 ? 0 : Math.min(cur,6), d = dots.children[idx]; if(d) sm.style.left = (d.offsetLeft + d.offsetWidth/2) + 'px'; }
window.addEventListener('resize', moveShip);

function drawTop(newPos){
  dots.innerHTML = S.map((s,i)=>'<div class="dot '+(solved.includes(i)?'done':(i===cur?'cur':''))+'">'+(i+1)+'</div>').join('') + '<div class="dot '+(cur===6?'cur':'')+'">🏴‍☠️</div>';
  let sl = '';
  for(let j=0;j<6;j++){
    const got = solved.includes(j);
    sl += '<div class="slot '+(got?'on':'')+(newPos===j?' pop':'')+'">'+(got?LET[j]:'?')+'</div>';
  }
  slotsEl.innerHTML = sl;
  moveShip();
}

  let w = 'M30 478'; for(let i=0;i<7;i++) w += ' q25 -12 50 0 t50 0'; w += ' q10 -6 20 0 t20 0 V530 H30Z';
  const n = esc(name), d = esc(date), F = "font-family=\"Georgia,'Times New Roman',serif\"";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" style="max-width:100%;height:auto;display:block;border-radius:10px;border:2px solid #a8845a" role="img" aria-label="Сертифікат">'
  + '<defs><linearGradient id="cp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3dc"/><stop offset="1" stop-color="#f0dfb2"/></linearGradient><linearGradient id="cw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa3c4"/><stop offset="1" stop-color="#1d6f8e"/></linearGradient></defs>'
  + '<rect width="800" height="560" fill="url(#cp)"/>'
  + '<rect x="16" y="16" width="768" height="528" rx="10" fill="none" stroke="#a8845a" stroke-width="6"/>'
  + '<rect x="30" y="30" width="740" height="500" rx="6" fill="none" stroke="#c9a26a" stroke-width="2" stroke-dasharray="10 6"/>'
  + '<text x="400" y="98" text-anchor="middle" font-size="46" font-weight="bold" letter-spacing="8" fill="#7a4a00" '+F+'>СЕРТИФІКАТ</text>'
  + '<text x="400" y="128" text-anchor="middle" font-size="18" font-style="italic" fill="#8a6d3b" '+F+'>про присвоєння звання штурмана</text>'
  + '<text x="400" y="176" text-anchor="middle" font-size="20" fill="#3b2a14" '+F+'>Цим засвідчується, що</text>'
  + '<text x="400" y="248" text-anchor="middle" font-size="'+fs+'" font-weight="bold" fill="#0f3d52" '+F+'>'+n+'</text>'
  + '<line x1="140" y1="266" x2="660" y2="266" stroke="#a8845a" stroke-width="2"/>'
  + '<text x="400" y="306" text-anchor="middle" font-size="17" fill="#3b2a14" '+F+'>Звання «ШТУРМАН» присвоєно за успішне проходження квесту</text>'
  + '<text x="400" y="332" text-anchor="middle" font-size="17" fill="#3b2a14" '+F+'>«Скарб капітана Вектора»: координати вектора, сума і різниця</text>'
  + '<text x="400" y="358" text-anchor="middle" font-size="17" fill="#3b2a14" '+F+'>векторів, довжина вектора та пошук скарбу.</text>'
  + '<path d="'+w+'" fill="url(#cw)"/>'
  + '<g transform="translate(350,384)"><path d="M50 2V64" stroke="#4a2c0e" stroke-width="3"/><path d="M50 12L50 58L14 58Z" fill="#fffaf0" stroke="#c9b48a" stroke-width="1.5"/><path d="M54 20L54 58L86 58Z" fill="#f6e3b4" stroke="#c9b48a" stroke-width="1.5"/><path d="M50 2L64 6L50 10Z" fill="#c0392b"/><path d="M6 60H94L80 84H22Z" fill="#8a5a2b" stroke="#4a2c0e" stroke-width="2"/><circle cx="32" cy="74" r="3" fill="#f5d76e"/><circle cx="50" cy="74" r="3" fill="#f5d76e"/><circle cx="68" cy="74" r="3" fill="#f5d76e"/></g>'
  + '<path d="M30 484 q25 -12 50 0" fill="none"/>'
  + '<g><circle cx="140" cy="420" r="44" fill="#c0392b" stroke="#8e2a20" stroke-width="4"/><circle cx="140" cy="420" r="35" fill="none" stroke="#f6d6d0" stroke-width="1.5" stroke-dasharray="3 3"/><text x="140" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" '+F+'>ВЕКТОР</text><text x="140" y="436" text-anchor="middle" font-size="18" fill="#ffe27a" '+F+'>★ ★ ★</text></g>'
  + '<text x="64" y="512" font-size="16" fill="#fff" '+F+'>Дата: '+d+'</text>'
  + '<line x1="560" y1="506" x2="740" y2="506" stroke="#fff" stroke-width="1.5"/>'
  + '<text x="650" y="498" text-anchor="middle" font-size="24" font-style="italic" fill="#fff" '+F+'>Капітан Вектор</text>'
  + '<text x="650" y="522" text-anchor="middle" font-size="12" fill="#cfe9f2" '+F+'>підпис капітана</text>'
  + '</svg>';
}

function showIntro(){
  assign(); cur = -1; drawTop();
  stage.innerHTML = '<div class="enter">' + scIntro()
    + '<h2>Лист у пляшці</h2>'
    + '<div class="story">Цього ранку хвиля викинула на берег порту пляшку. Усередині — пожовтілий лист і стара карта, прикрашена кораблями та якорями.</div>'
    + '<div class="letterbox">📜 «Я, капітан Вектор, усе життя ходив морями за напрямом і довжиною. Свій найбільший скарб я заховав у печері на далекому острові й зачинив скриню на кодовий замок із шести літер. Літери розкидані по шести станціях мого маршруту. Кожна станція ховає загадку: розв’яжеш — отримаєш літеру. Збери їх усі та склади кодове слово. Попутного вітру, юнго!»</div>'
    + '<div class="parrot"><div class="av">🦜</div><div class="bub"><b>Пеленг:</b> Кра! Я — папуга Пеленг, штурман цього корабля. Сидітиму на твоєму плечі й даватиму підказки. А як звати тебе, юнго? Запиши ім’я в судновий журнал: наприкінці подорожі воно з’явиться на сертифікаті!</div></div>'
    + '<div class="namebox"><input class="word nm" id="pname" maxlength="24" autocomplete="off" placeholder="Твоє ім’я"></div>'
    + '<div class="msg" id="nmsg"></div>'
    + '<div class="row" style="justify-content:center"><button class="btn" id="go0">⚓ Підняти якір</button></div></div>';
  const inp = document.getElementById('pname'); inp.value = PLAYER;
  const go = ()=>{ const v = inp.value.trim().replace(/\s+/g,' ');
    if(v.length < 2){ const m=document.getElementById('nmsg'); m.className='msg bad'; m.textContent='Напиши, будь ласка, своє ім’я (хоча б 2 літери).'; stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); return; }
    PLAYER = v; cur = 0; showStation(); };
  document.getElementById('go0').onclick = go;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

let vi = -1;            // -1 — основне завдання, 0.. — аналогічні
const Q = ()=> vi<0 ? S[cur] : S[cur].alts[vi];

function showStation(){
  drawTop(); vi = -1;
  const s = S[cur];
  let h = '<div class="enter">' + s.scene() + '<h2>'+s.title+'</h2>';
  h += '<div class="story">📜 '+s.story+'</div>';
  h += '<div class="parrot"><div class="av">🦜</div><div class="bub"><b>Пеленг:</b> '+s.parrot+'</div></div>';
  h += '<div id="qbox"></div>';
  h += '<div class="reward" id="reward"><div class="after">⚓ '+s.after+'</div>Ти отримуєш нову літеру кодового слова:<br><b class="letter">'+LET[cur]+'</b></div>';
  h += '<div class="row"><button class="btn" id="next" style="display:none">'+(cur===5?'До скарбниці →':'Підняти вітрила →')+'</button></div></div>';
  stage.innerHTML = h;
  document.getElementById('next').onclick = ()=>{ cur++; cur===6 ? showFinal() : showStation(); window.scrollTo({top:0,behavior:'smooth'}); };
  renderQ();
}

function renderQ(){
  const s = S[cur], q = Q();
  order = shuffle(q.opts.map((_,i)=>i));
  let h = '';
  if(vi>=0) h += '<div class="again">🔁 Аналогічне завдання</div>';
  h += '<div class="task">'+q.task+'</div>';
  if(q.plot) h += '<div class="plot">'+plot(q.plot)+'</div>';
  h += '<div class="opts" id="opts">' + order.map(i=>'<button class="opt" data-i="'+i+'">'+q.opts[i]+'</button>').join('') + '</div>';
  h += '<div class="msg" id="msg"></div>';
  h += '<div class="hint" id="hint">💡 '+s.hint+'</div>';
  h += '<div class="expl" id="expl"></div>';
  h += '<div class="row"><button class="btn ghost" id="hbtn">💡 Підказка</button><button class="btn" id="retry" style="display:none"></button></div>';
  document.getElementById('qbox').innerHTML = h;
  typeset();
  document.getElementById('hbtn').onclick = ()=>{ const e=document.getElementById('hint'); e.style.display = e.style.display==='block'?'none':'block'; };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
}

function pick(b){
  const s = S[cur], q = Q(), i = +b.dataset.i, msg = document.getElementById('msg');
  if(i === q.right){
    b.classList.add('right');
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    msg.className='msg ok'; msg.textContent = vi>=0 ? '✔ Цього разу вийшло! Молодець, '+PLAYER+'!' : '✔ Вірно, '+PLAYER+'!';
    document.getElementById('reward').style.display='block';
    document.getElementById('next').style.display='inline-block';
    document.getElementById('retry').style.display='none';
    const fresh = !solved.includes(cur);
    if(fresh) solved.push(cur);
    drawTop(fresh ? cur : undefined);
    burst(b,['⭐','🪙','🫧','⚓','✨']);
    document.getElementById('reward').scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    b.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    msg.className='msg bad'; msg.textContent='✘ '+WRONG[Math.floor(Math.random()*WRONG.length)];
    const ex = document.getElementById('expl');
    ex.innerHTML = '<b>📘 Розбір рішення:</b><br>'+q.expl+'<br><i>Правильна відповідь: '+q.opts[q.right]+'.</i>';
    ex.style.display = 'block';
    const more = vi+1 < s.alts.length, rb = document.getElementById('retry');
    rb.textContent = more ? '🔁 Аналогічне завдання →' : '↻ Спробувати ще раз';
    rb.style.display = 'inline-block';
    rb.onclick = ()=>{ if(more) vi++; renderQ(); };
    typeset();
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    burst(b,['💦','🌊'],6);
    ex.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function showFinal(){
  drawTop();
  stage.innerHTML = '<div class="enter"><div id="fin">' + sceneFinal()
    + '<h2>Скриня зачинена!</h2>'
    + '<div class="story">📜 Печера Скарбів. У глибині, на кам’яному виступі, стоїть скриня капітана Вектора. На її замку — шість порожніх клітинок для літер.</div>'
    + '<div class="parrot"><div class="av">🦜</div><div class="bub"><b>Пеленг:</b> Кра! Ти зібрав усі літери, '+esc(PLAYER)+'! Але вони перемішалися. Склади з них кодове слово. Підказка: так звати нашого капітана!</div></div>'
    + '<div class="final"><div class="ansrow" id="ans"></div><div class="tiles" id="tiles"></div>'
    + '<div class="msg" id="fm"></div><div class="row" style="justify-content:center"><button class="btn ghost" id="clr">↺ Спочатку</button><button class="btn" id="go" disabled>🔑 Відкрити скриню</button></div></div></div>'
    + '<div class="win" id="win" style="display:none"><div class="letterbox">📜 «Хто вміє знаходити координати, додавати й віднімати вектори та вимірювати їхню довжину, той знайде дорогу до будь-якого скарбу. Тепер ти, '+esc(PLAYER)+', — справжній штурман!» <br>— капітан Вектор</div>'
    + '<div class="badge">🧭 Звання: Штурман</div>'
    + '<p>Ти впорався з усіма завданнями: знаходив координати вектора, додавав і віднімав вектори та обчислював їхню довжину.</p>'
    + '<h2>🏅 Твій сертифікат</h2><div id="certbox"></div>'
    + '<div class="row" style="justify-content:center;margin:12px 0"><button class="btn ghost" id="again">⛵ Пройти ще раз</button></div></div></div>';
  let ans = [];
  const renderW = ()=>{
    document.getElementById('ans').innerHTML = [0,1,2,3,4,5].map(k=>'<button class="slot '+(k<ans.length?'on':'')+'" data-k="'+k+'">'+(k<ans.length?LET[ans[k]]:'')+'</button>').join('');
    document.getElementById('tiles').innerHTML = LET.map((l,i)=>'<button class="tileb" data-i="'+i+'"'+(ans.includes(i)?' disabled':'')+'>'+l+'</button>').join('');
    document.getElementById('go').disabled = ans.length < 6;
    document.querySelectorAll('.tileb').forEach(b=>b.onclick=()=>{ if(ans.length<6){ ans.push(+b.dataset.i); document.getElementById('fm').textContent=''; renderW(); } });
    document.querySelectorAll('#ans .slot').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(k<ans.length){ ans.splice(k,1); renderW(); } });
  };
  renderW();
  document.getElementById('clr').onclick = ()=>{ ans=[]; document.getElementById('fm').textContent=''; renderW(); };
  const check = ()=>{
    const v = ans.map(i=>LET[i]).join(''), fm = document.getElementById('fm');
    if(v === WORD){
      document.querySelector('.final').style.display='none';
      const sv = document.querySelector('#fin svg'); sv.classList.add('open');
      document.querySelector('#fin h2').textContent = 'Скриня відкрита! 💰';
      document.getElementById('win').style.display='block';
      document.getElementById('certbox').innerHTML = certSVG(PLAYER, new Date().toLocaleDateString('uk-UA'));
      burst(sv,['🪙','💎','⭐','✨','👑'],26);
      setTimeout(()=>burst(sv,['🪙','💎','⭐'],18),700);
    } else {
      fm.className='msg bad'; fm.textContent='Це не те слово. Спробуй інший порядок літер!';
      stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    }
  };
  document.getElementById('go').onclick = check;
  document.getElementById('again').onclick = ()=>{ solved=[]; showIntro(); window.scrollTo({top:0,behavior:'smooth'}); };
}

showIntro();
</script>
</body>
</html>
